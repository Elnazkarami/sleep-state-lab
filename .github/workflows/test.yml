name: tests

# Runs the synthetic suite only. There is no dataset in CI and none is
# downloaded: the tests that need recordings are marked `realdata` and are not
# selected here, so a green run means the pipeline is sound, not that anything
# was measured on sleep.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,plots]"
      - name: lint
        # No --no-cache needed on a fresh runner, but note that ruff honours
        # .gitignore: a directory excluded there is silently not linted, which is
        # how a whole package once went unchecked. tests/test_packaging.py now
        # fails if any source file is ignored.
        run: ruff check src tests
      - name: tests
        run: pytest -q -m "not realdata"
      - name: the pipeline runs end to end without any recordings
        run: sleepstatelab smoke --out-dir outputs/smoke
