[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-state-lab"
version = "0.1.0"
description = "SleepStateLab - self-supervised EEG representation learning and sleep-state decoding"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Elnaz Alikarami", email = "elnaz.karami@gmail.com" }]

# Everything the first release actually runs is a hard dependency: unlike the
# provenance core of PhysioML, there is no part of this package that is useful
# without arrays. Torch is included because the trainable encoder is the point
# of the repository, not an optional extra.
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "mne>=1.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
# Ruff is pinned: an unpinned linter changes the meaning of a green CI run
# between two commits that did not touch the code.
dev   = ["pytest>=8.0", "ruff==0.16.5", "matplotlib>=3.8"]

[project.scripts]
sleepstatelab = "sleepstatelab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "synthetic: runs entirely on generated signals, no recordings required",
  "realdata: requires a Sleep-EDF Expanded data root to be present",
  "slow: takes more than a few seconds",
]

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "B", "SIM", "RUF", "C4", "PIE", "RET", "I", "UP"]
ignore = ["RET504", "SIM108"]

[tool.ruff.lint.isort]
# The distribution is named sleep-state-lab and the package sleepstatelab, which
# ruff cannot connect on its own; without this it sorts the package's own
# imports as third-party and the result differs between machines.
known-first-party = ["sleepstatelab"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "SIM", "RUF012", "B011"]
